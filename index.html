<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔐 TOTP Authenticator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 500px;
      width: 100%;
      padding: 40px;
    }
    h1 { color: #333; margin-bottom: 10px; font-size: 28px; text-align: center; }
    .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; text-align: center; }
    .tab-buttons { display: flex; gap: 10px; margin-bottom: 30px; }
    .tab-btn {
      flex: 1; padding: 12px; border: 2px solid #ddd; background: white;
      border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.3s;
    }
    .tab-btn.active { border-color: #667eea; background: #667eea; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .form-group { margin-bottom: 20px; }
    label { display: block; color: #333; font-weight: bold; margin-bottom: 8px; font-size: 14px; }
    .input-group { display: flex; gap: 8px; }
    input[type="text"], input[type="password"] {
      flex: 1; padding: 12px; border: 2px solid #ddd; border-radius: 8px;
      font-size: 16px; font-family: monospace; transition: border-color 0.3s;
    }
    input:focus { outline: none; border-color: #667eea; }
    .code-input { font-size: 24px !important; text-align: center; letter-spacing: 10px; }
    .secret-input { font-size: 14px !important; letter-spacing: 1px; }
    .btn {
      width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold;
      cursor: pointer; transition: transform 0.2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-secondary { background: #6c757d; margin-top: 10px; }
    .btn-secondary:hover { background: #5a6268; }
    .message { padding: 12px; border-radius: 8px; margin-bottom: 20px; display: none; font-size: 14px; }
    .message.active { display: block; }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .code-result { background: #f5f5f5; padding: 20px; border-radius: 8px; text-align: center; margin: 20px 0; display: none; }
    .code-display { font-family: 'Courier New', monospace; font-size: 36px; font-weight: bold; color: #667eea; letter-spacing: 6px; margin: 15px 0; }
    .timer-bar { height: 6px; background: #ddd; border-radius: 3px; overflow: hidden; margin: 15px 0; }
    .timer-fill { height: 100%; background: linear-gradient(90deg, #667eea 0%, #764ba2 100%); transition: width 0.1s linear; }
    .time-label { font-size: 13px; color: #666; margin-top: 8px; }
    .account-item { background: #f5f5f5; padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .account-name { font-weight: bold; color: #333; }
    .account-secret { font-size: 12px; color: #666; font-family: monospace; word-break: break-all; margin-top: 4px; }
    .delete-btn { background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .delete-btn:hover { background: #c82333; }
    .info-text { color: #666; font-size: 13px; line-height: 1.6; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 TOTP Authenticator</h1>
    <p class="subtitle">Generate & verify time-based authentication codes</p>

    <div class="tab-buttons">
      <button class="tab-btn active" onclick="switchTab('generate')">Generate</button>
      <button class="tab-btn" onclick="switchTab('verify')">Verify</button>
      <button class="tab-btn" onclick="switchTab('accounts')">Accounts</button>
    </div>

    <!-- GENERATE TAB -->
    <div id="generateTab" class="tab-content active">
      <div class="message" id="genMessage"></div>
      <div class="form-group">
        <label for="genAccountName">Account Name</label>
        <input type="text" id="genAccountName" placeholder="e.g., MyApp, Gmail">
      </div>
      <div class="form-group">
        <label for="genSecret">Secret Key (Base32)</label>
        <div class="input-group">
          <input type="text" id="genSecret" class="secret-input" placeholder="Paste Base32 secret">
          <button class="btn" style="flex: 0 0 auto; width: auto; padding: 12px 16px;" onclick="generateRandomSecret()">Random</button>
        </div>
      </div>
      <button class="btn" onclick="generateCode()">Generate Code</button>
      <button class="btn btn-secondary" onclick="saveAccount()">Save Account</button>
      <div class="code-result" id="genResult">
        <div>Current Code:</div>
        <div class="code-display" id="genCodeDisplay">000000</div>
        <div class="timer-bar"><div class="timer-fill" id="genTimerFill" style="width: 100%"></div></div>
        <div class="time-label">Expires in <span id="genTimeLeft">30</span>s</div>
      </div>
    </div>

    <!-- VERIFY TAB -->
    <div id="verifyTab" class="tab-content">
      <div class="message" id="verifyMessage"></div>
      <div class="form-group">
        <label for="verifySecret">Secret Key (Base32)</label>
        <input type="text" id="verifySecret" class="secret-input" placeholder="Paste Base32 secret">
      </div>
      <div class="form-group">
        <label for="verifyCode">6-Digit Code</label>
        <input type="text" id="verifyCode" class="code-input" placeholder="000000" maxlength="6" inputmode="numeric">
      </div>
      <button class="btn" onclick="verifyCode()">Verify Code</button>
      <div class="code-result" id="verifyResult">
        <div id="verifyResultText"></div>
      </div>
    </div>

    <!-- ACCOUNTS TAB -->
    <div id="accountsTab" class="tab-content">
      <div id="accountsList">
        <p style="text-align: center; color: #666;">No saved accounts</p>
      </div>
      <button class="btn btn-secondary" onclick="clearAllAccounts()">Clear All</button>
    </div>
  </div>

  <script>
    // Base32 decode
    function base32Decode(str) {
      const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
      let bits = "";
      let value = 0;
      for (let i = 0; i < str.length; i++) {
        const index = alphabet.indexOf(str[i].toUpperCase());
        if (index === -1) throw new Error("Invalid base32");
        value = (value << 5) | index;
        bits += value.toString(2).padStart((i + 1) * 5, "0");
      }
      const bytes = [];
      for (let i = 0; i + 8 <= bits.length; i += 8) {
        bytes.push(parseInt(bits.substr(i, 8), 2));
      }
      return new Uint8Array(bytes);
    }

    // HMAC-SHA1
    async function hmacSha1(key, message) {
      const cryptoKey = await crypto.subtle.importKey("raw", key, { name: "HMAC", hash: "SHA-1" }, false, ["sign"]);
      return await crypto.subtle.sign({ name: "HMAC", hash: "SHA-1" }, cryptoKey, message);
    }

    // Generate TOTP
    async function generateTOTP(secret, time = null) {
      if (!time) time = Math.floor(Date.now() / 1000);
      let epoch = Math.floor(time / 30);
      const msg = new Uint8Array(8);
      for (let i = 7; i >= 0; i--) {
        msg[i] = epoch & 0xff;
        epoch = Math.floor(epoch / 256);
      }
      const bytes = base32Decode(secret);
      const hmac = await hmacSha1(bytes, msg);
      const view = new Uint8Array(hmac);
      const offset = view[view.length - 1] & 0x0f;
      const code = ((view[offset] & 0x7f) << 24) | ((view[offset + 1] & 0xff) << 16) | ((view[offset + 2] & 0xff) << 8) | (view[offset + 3] & 0xff);
      return (code % 1000000).toString().padStart(6, "0");
    }

    // Verify TOTP
    async function verifyTOTP(secret, token, time = null) {
      if (!time) time = Math.floor(Date.now() / 1000);
      const timeWindow = Math.floor(time / 30);
      for (let i = -1; i <= 1; i++) {
        let epoch = timeWindow + i;
        const msg = new Uint8Array(8);
        for (let j = 7; j >= 0; j--) {
          msg[j] = epoch & 0xff;
          epoch = Math.floor(epoch / 256);
        }
        const bytes = base32Decode(secret);
        const hmac = await hmacSha1(bytes, msg);
        const view = new Uint8Array(hmac);
        const offset = view[view.length - 1] & 0x0f;
        const code = ((view[offset] & 0x7f) << 24) | ((view[offset + 1] & 0xff) << 16) | ((view[offset + 2] & 0xff) << 8) | (view[offset + 3] & 0xff);
        if ((code % 1000000).toString().padStart(6, "0") === token) return true;
      }
      return false;
    }

    function generateRandomSecret() {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
      let secret = "";
      for (let i = 0; i < 32; i++) {
        secret += chars[Math.floor(Math.random() * chars.length)];
      }
      document.getElementById('genSecret').value = secret;
    }

    async function generateCode() {
      const secret = document.getElementById('genSecret').value.trim();
      const msg = document.getElementById('genMessage');
      if (!secret) {
        msg.textContent = "Enter or generate a secret";
        msg.className = "message active error";
        return;
      }
      try {
        const code = await generateTOTP(secret);
        document.getElementById('genCodeDisplay').textContent = code;
        document.getElementById('genResult').style.display = "block";
        updateTimers();
        msg.className = "message";
      } catch (e) {
        msg.textContent = "Invalid secret: " + e.message;
        msg.className = "message active error";
      }
    }

    function saveAccount() {
      const name = document.getElementById('genAccountName').value.trim();
      const secret = document.getElementById('genSecret').value.trim();
      if (!name || !secret) {
        document.getElementById('genMessage').textContent = "Enter name and secret";
        document.getElementById('genMessage').className = "message active error";
        return;
      }
      let accounts = JSON.parse(localStorage.getItem('totp_accounts') || '[]');
      accounts.push({ name, secret, date: new Date().toLocaleString() });
      localStorage.setItem('totp_accounts', JSON.stringify(accounts));
      document.getElementById('genMessage').textContent = "Account saved!";
      document.getElementById('genMessage').className = "message active success";
      setTimeout(() => renderAccounts(), 1000);
    }

    async function verifyCode() {
      const secret = document.getElementById('verifySecret').value.trim();
      const code = document.getElementById('verifyCode').value.trim();
      const result = document.getElementById('verifyResult');
      const msg = document.getElementById('verifyMessage');
      if (!secret || code.length !== 6) {
        msg.textContent = "Enter secret and 6-digit code";
        msg.className = "message active error";
        return;
      }
      try {
        const valid = await verifyTOTP(secret, code);
        result.style.display = "block";
        if (valid) {
          document.getElementById('verifyResultText').textContent = "✓ Code is VALID";
          document.getElementById('verifyResultText').style.color = "#155724";
          msg.className = "message active success";
          msg.textContent = "Code verified successfully!";
        } else {
          document.getElementById('verifyResultText').textContent = "✗ Code is INVALID";
          document.getElementById('verifyResultText').style.color = "#721c24";
          msg.className = "message active error";
          msg.textContent = "Code verification failed";
        }
      } catch (e) {
        msg.textContent = "Error: " + e.message;
        msg.className = "message active error";
      }
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tab + 'Tab').classList.add('active');
      event.target.classList.add('active');
      if (tab === 'accounts') renderAccounts();
    }

    function renderAccounts() {
      const accounts = JSON.parse(localStorage.getItem('totp_accounts') || '[]');
      const list = document.getElementById('accountsList');
      if (accounts.length === 0) {
        list.innerHTML = '<p style="text-align: center; color: #666;">No saved accounts</p>';
        return;
      }
      list.innerHTML = accounts.map((acc, idx) => `
        <div class="account-item">
          <div>
            <div class="account-name">${acc.name}</div>
            <div class="account-secret">${acc.secret}</div>
          </div>
          <button class="delete-btn" onclick="deleteAccount(${idx})">Delete</button>
        </div>
      `).join('');
    }

    function deleteAccount(idx) {
      let accounts = JSON.parse(localStorage.getItem('totp_accounts') || '[]');
      accounts.splice(idx, 1);
      localStorage.setItem('totp_accounts', JSON.stringify(accounts));
      renderAccounts();
    }

    function clearAllAccounts() {
      if (confirm('Delete all saved accounts?')) {
        localStorage.removeItem('totp_accounts');
        renderAccounts();
      }
    }

    function updateTimers() {
      const now = Math.floor(Date.now() / 1000);
      const timeLeft = 30 - (now % 30);
      document.getElementById('genTimeLeft').textContent = timeLeft;
      document.getElementById('genTimerFill').style.width = ((timeLeft / 30) * 100) + '%';
    }

    setInterval(updateTimers, 100);
  </script>
</body>
</html>
